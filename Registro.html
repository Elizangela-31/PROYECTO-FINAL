<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="estilos.css">
</head>
<style>*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:linear-gradient(135deg,#1F6662,#16524F,#C8E6C9);

    min-height:100vh;

    display:flex;

    flex-direction:column;
}

.section-form{
    flex:1;
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px;
}

.registro-card{

    width:100%;
    max-width:650px;

    background:#ffffff;

    border-radius:20px;

    padding:45px;

    box-shadow:0 15px 40px rgba(0,0,0,.18);

}

.eyebrow{

    color:#1F6662;

    font-weight:700;

    text-transform:uppercase;

    letter-spacing:2px;

    margin-bottom:10px;

    font-size:14px;
}

.registro-card h2{

    color:#1F6662;

    margin-bottom:10px;

    font-size:32px;

    line-height:1.2;
}

.registro-card p{

    color:#666;

    margin-bottom:25px;

    line-height:1.6;
}

.contact-form{

    display:flex;

    flex-direction:column;

    gap:18px;
}

.contact-form label{

    font-weight:600;

    color:#1F6662;
}

.contact-form input,
.contact-form select{

    padding:15px;

    border:2px solid #C8E6C9;

    border-radius:12px;

    font-size:15px;

    transition:.3s;
}

.contact-form input:focus,
.contact-form select:focus{

    outline:none;

    border-color:#43A047;

    box-shadow:0 0 10px rgba(67,160,71,.3);
}

.btn{

    padding:15px;

    border:none;

    border-radius:12px;

    background:linear-gradient(135deg,#2E7D32,#43A047);

    color:white;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    transition:.3s;
}

.btn:hover{

    transform:translateY(-3px);

    box-shadow:0 10px 20px rgba(46,125,50,.35);
}

.form-message{

    margin-top:15px;

    text-align:center;

    font-weight:600;

    color:#2E7D32;
}

@media(max-width:768px){

.registro-card{

padding:30px;

}

.registro-card h2{

font-size:26px;

}

}</style>
<body>

  <header class="site-header">
    <nav class="navbar" aria-label="Navegación principal">
      <a class="brand" href="index.html" aria-label="Ir al inicio">
        <img class="brand-mark" src="biodiversidad.jpg" alt="Logo EcuaTours">
        <span>EcuaTours</span>
      </a>

      <button class="menu-toggle" type="button" aria-label="Abrir menú" aria-expanded="false">
        <span></span>
        <span></span>
      </button>

      <ul class="nav-links">
        <li><a href="index.html#inicio" class="nav-link">Inicio</a></li>
        <li><a href="index.html#servicios" class="nav-link">Servicios</a></li>
        <li><a href="informacion-destinos.html" class="nav-link">Destinos</a></li>
        <li><a href="index.html#paquetes" class="nav-link">Paquetes</a></li>
        <li><a href="admin.html" class="nav-link nav-cta">Admin</a></li>
      </ul>
    </nav>
  </header>

    <section id="registro" class="section section-form">
      <div class="registro-card">
        <a href="index.html" style="display:inline-block;margin-bottom:20px;color:#1F6662;font-weight:600;text-decoration:none;">&larr; Volver al inicio</a>
        <div>
          <h2>Solicita información de tu paquete</h2>
          <p>Déjanos tus datos y te contactamos para darte seguimiento a tu reserva.</p>
        </div>

        <form id="formulario" class="contact-form" novalidate>
          <label for="nombre">Nombre completo</label>
          <input type="text" id="nombre" name="nombre" placeholder="Ej. Ana Torres" required minlength="2">

          <label for="correo">Correo electrónico</label>
          <input type="email" id="correo" name="correo" placeholder="correo@ejemplo.com" required>

          <label for="telefono">Teléfono / WhatsApp</label>
          <input type="tel" id="telefono" name="telefono" placeholder="Ej. 0991234567" required minlength="7">

          <label for="interes">Paquete de interés</label>
          <select id="interes" name="interes">
            <option value="Información general">Información general</option>
            <option value="Costa y descanso frente al mar">Costa y descanso frente al mar</option>
            <option value="Galapagos naturaleza unica">Galapagos naturaleza unica</option>
            <option value="Sierra volcanes y cultura">Sierra volcanes y cultura</option>
            <option value="Amazonia selva y comunidades">Amazonia selva y comunidades</option>
            <option value="Ruta volcanes y cascadas">Ruta volcanes y cascadas</option>
            <option value="Quito y ciudades patrimoniales">Quito y ciudades patrimoniales</option>
            <option value="Selva y kayak amazónico">Selva y kayak amazónico</option>
            <option value="Cuenca colonial y artesanías">Cuenca colonial y artesanías</option>
            <option value="Galápagos costa y snorkel">Galápagos costa y snorkel</option>
            <option value="Refugio de Vida Silvestre Pasochoa">Refugio de Vida Silvestre Pasochoa</option>
            <option value="Rutas en cuadrón">Rutas en cuadrón</option>
            <option value="Truchas y turismo rural en Rumipamba">Truchas y turismo rural en Rumipamba</option>
          </select>
 
          <button class="btn btn-primary" type="submit">Enviar solicitud</button>
          <p id="respuesta" class="form-message" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>

  <footer class="site-footer">
    <p>Derechos reservados-EcuaTours</p>
  </footer>

  <script>
    const menuButton = document.querySelector(".menu-toggle");
    const navLinks = document.querySelector(".nav-links");

    menuButton.addEventListener("click", () => {
      const isOpen = navLinks.classList.toggle("open");
      menuButton.setAttribute("aria-expanded", isOpen ? "true" : "false");
    });
  </script>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
      import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyAlCunDxQE0WI2Wk2qKATwxzB8mf20Mlfg",
        authDomain: "ecuatours-d42ae.firebaseapp.com",
        projectId: "ecuatours-d42ae",
        storageBucket: "ecuatours-d42ae.firebasestorage.app",
        messagingSenderId: "336658956433",
        appId: "1:336658956433:web:b60cc6f1d2608704edff30"
      };

      const firebaseApp = initializeApp(firebaseConfig);
      const db = getFirestore(firebaseApp);

      const form = document.getElementById("formulario");
      const respuesta = document.getElementById("respuesta");
      const interes = document.getElementById("interes");

      const parametros = new URLSearchParams(window.location.search);
      const interesPrevio = parametros.get("interes");
      if (interesPrevio && [...interes.options].some((opcion) => opcion.value === interesPrevio)) {
        interes.value = interesPrevio;
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        respuesta.classList.remove("error");

        if (!form.checkValidity()) {
          respuesta.textContent = "Completa tu nombre, correo y teléfono.";
          respuesta.classList.add("error");
          form.reportValidity();
          return;
        }

        const submitButton = form.querySelector("button[type='submit']");
        submitButton.disabled = true;
        submitButton.textContent = "Enviando...";
        respuesta.textContent = "";

        const nombre = document.getElementById("nombre").value.trim();
        const correo = document.getElementById("correo").value.trim();
        const telefono = document.getElementById("telefono").value.trim();
        const interesSeleccionado = interes.value;

        try {
          await addDoc(collection(db, "solicitudes"), {
            nombre,
            correo,
            telefono,
            interes: interesSeleccionado,
            estado: "pendiente",
            creadoEn: serverTimestamp()
          });

          respuesta.textContent = "Solicitud enviada. Te contactaremos pronto.";
          form.reset();
        } catch (error) {
          respuesta.textContent = "No se pudo enviar la solicitud. Intenta de nuevo.";
          respuesta.classList.add("error");
        } finally {
          submitButton.disabled = false;
          submitButton.textContent = "Enviar solicitud";
        }
      });
    </script>
  </body>
</html>
